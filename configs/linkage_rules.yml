# Baseline-to-endline record linkage. Frozen contract.
#
# Thresholds mirror the real LDS II pipeline (spec §1): 0.75 accept, 0.65 review floor.
# The real pipeline started at 0.85 and lowered to 0.75 to trade precision for recall;
# the threshold sweep below reproduces that tradeoff as a measured curve.

deterministic:
  passes:
    - pass_id: DET_EXACT_LRN
      description: Exact match on cleaned LRN within school.
      keys: [school_id, lrn_clean]
      require_non_null: [lrn_clean]
    - pass_id: DET_NAME_DOB_SEX
      description: Exact match on standardized name, birth date, and sex within school.
      keys: [school_id, student_name_clean, birthday_str, sex]
      require_non_null: [student_name_clean, birthday_str, sex]
    - pass_id: DET_NAME_DOB_SEX_CROSS_SCHOOL
      description: Same as above but ignoring school, to catch transfers.
      keys: [student_name_clean, birthday_str, sex]
      require_non_null: [student_name_clean, birthday_str, sex]

probabilistic:
  backend: duckdb
  # Per-school loop with a fresh DuckDBAPI() per school, matching the real pipeline.
  scope: per_school
  random_seed: 42
  em_sample_fraction: 0.10

  blocking_rules:
    - "l.first_letter_name = r.first_letter_name"
    - "l.birthday_str = r.birthday_str"
    - "l.sex = r.sex and substr(l.student_name_clean, 1, 3) = substr(r.student_name_clean, 1, 3)"

  comparisons:
    - column: student_name_clean
      method: jaro_winkler
      thresholds: [0.92, 0.85, 0.70]
    - column: birthday_str
      method: levenshtein
      thresholds: [1, 2]
    - column: sex
      method: exact

  accept_threshold: 0.75
  review_floor: 0.65
  # Scorecard sweeps this range to produce the precision/recall curve (spec §3.2).
  sweep: [0.50, 0.55, 0.60, 0.65, 0.70, 0.75, 0.80, 0.85, 0.90, 0.95]

review_queue:
  send_to_review_when:
    - score_between_review_floor_and_accept
    - multiple_candidates_above_accept
    - deterministic_probabilistic_conflict
    - birthdate_differs_name_and_sex_close
