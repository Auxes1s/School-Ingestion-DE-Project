[project]
name = "sbfp-platform"
version = "0.1.0"
description = "Privacy-safe public-sector data platform for school feeding monitoring and evaluation"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }

dependencies = [
    "duckdb>=1.1",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "numpy>=1.26",
    "pandera>=0.20",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    "openpyxl>=3.1",
    "xlsxwriter>=3.2",
    "python-dateutil>=2.9",
    "splink>=4.0",
    "dbt-core>=1.8",
    "dbt-duckdb>=1.8",
    "dagster>=1.8",
    "dagster-webserver>=1.8",
    "streamlit>=1.38",
    "altair>=5.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
sbfp-platform = "sbfp_platform.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sbfp_platform"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PTH"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: end-to-end tests using the tiny profile (deselect with '-m \"not integration\"')",
]
