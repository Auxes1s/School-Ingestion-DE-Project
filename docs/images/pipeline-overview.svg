<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">School Feeding Data Platform architecture</title>
  <desc id="desc">Messy school files flow through bronze ingestion, dbt silver, data quality and Splink linkage, dbt gold, measured scorecards, and a Streamlit dashboard. A hidden answer key is available only to evaluation.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#5eead4"/>
    </marker>
    <marker id="truth-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#fbbf24"/>
    </marker>
  </defs>

  <rect width="1200" height="440" rx="24" fill="#0f172a"/>
  <text x="44" y="52" fill="#f8fafc" font-family="Inter,Segoe UI,sans-serif" font-size="27" font-weight="600">From messy submissions to measured trust</text>
  <text x="44" y="80" fill="#94a3b8" font-family="Inter,Segoe UI,sans-serif" font-size="15">One local, reproducible path • synthetic data only • every result testable against known truth</text>

  <text x="44" y="124" fill="#5eead4" font-family="Inter,Segoe UI,sans-serif" font-size="12" font-weight="600" letter-spacing="1.4">PIPELINE — CANNOT READ THE ANSWER KEY</text>
  <g font-family="Inter,Segoe UI,sans-serif">
    <g transform="translate(44 146)">
      <rect width="170" height="92" rx="14" fill="#172554" stroke="#3b82f6"/>
      <text x="18" y="32" fill="#dbeafe" font-size="17" font-weight="600">Messy sources</text>
      <text x="18" y="58" fill="#93c5fd" font-size="13">CSV + XLSX</text>
      <text x="18" y="77" fill="#93c5fd" font-size="13">13 tiny-profile files</text>
    </g>
    <path d="M214 192H248" stroke="#5eead4" stroke-width="2" marker-end="url(#arrow)"/>
    <g transform="translate(250 146)">
      <rect width="170" height="92" rx="14" fill="#164e63" stroke="#22d3ee"/>
      <text x="18" y="32" fill="#cffafe" font-size="17" font-weight="600">Bronze</text>
      <text x="18" y="58" fill="#a5f3fc" font-size="13">Hashes + manifest</text>
      <text x="18" y="77" fill="#a5f3fc" font-size="13">Drift + provenance</text>
    </g>
    <path d="M420 192H454" stroke="#5eead4" stroke-width="2" marker-end="url(#arrow)"/>
    <g transform="translate(456 146)">
      <rect width="170" height="92" rx="14" fill="#134e4a" stroke="#2dd4bf"/>
      <text x="18" y="32" fill="#ccfbf1" font-size="17" font-weight="600">dbt Silver</text>
      <text x="18" y="58" fill="#99f6e4" font-size="13">Canonical records</text>
      <text x="18" y="77" fill="#99f6e4" font-size="13">4 tested models</text>
    </g>
    <path d="M626 192H660" stroke="#5eead4" stroke-width="2" marker-end="url(#arrow)"/>
    <g transform="translate(662 132)">
      <rect width="190" height="120" rx="14" fill="#3f3c16" stroke="#facc15"/>
      <text x="18" y="32" fill="#fef9c3" font-size="17" font-weight="600">Python intelligence</text>
      <text x="18" y="60" fill="#fef08a" font-size="13">21 DQA rules</text>
      <text x="18" y="82" fill="#fef08a" font-size="13">Deterministic + Splink 4</text>
      <text x="18" y="104" fill="#fef08a" font-size="13">One-to-one resolver</text>
    </g>
    <path d="M852 192H886" stroke="#5eead4" stroke-width="2" marker-end="url(#arrow)"/>
    <g transform="translate(888 146)">
      <rect width="170" height="92" rx="14" fill="#14532d" stroke="#4ade80"/>
      <text x="18" y="32" fill="#dcfce7" font-size="17" font-weight="600">dbt Gold</text>
      <text x="18" y="58" fill="#bbf7d0" font-size="13">Privacy-safe marts</text>
      <text x="18" y="77" fill="#bbf7d0" font-size="13">6 tested models</text>
    </g>
    <path d="M1058 192H1090" stroke="#5eead4" stroke-width="2" marker-end="url(#arrow)"/>
    <g transform="translate(1092 146)">
      <rect width="64" height="92" rx="14" fill="#312e81" stroke="#818cf8"/>
      <text x="32" y="36" text-anchor="middle" fill="#e0e7ff" font-size="14" font-weight="600">Serve</text>
      <text x="32" y="60" text-anchor="middle" fill="#c7d2fe" font-size="11">App +</text>
      <text x="32" y="76" text-anchor="middle" fill="#c7d2fe" font-size="11">exports</text>
    </g>
  </g>

  <text x="44" y="291" fill="#fbbf24" font-family="Inter,Segoe UI,sans-serif" font-size="12" font-weight="600" letter-spacing="1.4">EVALUATION-ONLY LANE</text>
  <g font-family="Inter,Segoe UI,sans-serif">
    <g transform="translate(44 309)">
      <rect width="236" height="66" rx="13" fill="#451a03" stroke="#f59e0b" stroke-dasharray="6 4"/>
      <text x="18" y="28" fill="#fef3c7" font-size="16" font-weight="600">Hidden answer key</text>
      <text x="18" y="49" fill="#fde68a" font-size="12">Injected defects + true links</text>
    </g>
    <path d="M280 342H476" stroke="#fbbf24" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#truth-arrow)"/>
    <path d="M757 252V294H600V307" fill="none" stroke="#5eead4" stroke-width="2" marker-end="url(#arrow)"/>
    <g transform="translate(478 309)">
      <rect width="244" height="66" rx="13" fill="#422006" stroke="#fbbf24"/>
      <text x="18" y="28" fill="#fef3c7" font-size="16" font-weight="600">Measured scorecards</text>
      <text x="18" y="49" fill="#fde68a" font-size="12">Sensitivity • precision • recall • F1</text>
    </g>
    <path d="M722 342H888" stroke="#fbbf24" stroke-width="2" marker-end="url(#truth-arrow)"/>
    <g transform="translate(890 309)">
      <rect width="266" height="66" rx="13" fill="#312e81" stroke="#818cf8"/>
      <text x="18" y="28" fill="#e0e7ff" font-size="16" font-weight="600">Dashboard</text>
      <text x="18" y="49" fill="#c7d2fe" font-size="12">Scorecards • no names, LRNs, raw payloads</text>
    </g>
  </g>

  <line x1="44" y1="404" x2="1156" y2="404" stroke="#334155"/>
  <text x="44" y="426" fill="#94a3b8" font-family="Inter,Segoe UI,sans-serif" font-size="12">Python · DuckDB · Parquet · dbt · Splink · Dagster · Streamlit · pytest</text>
</svg>
